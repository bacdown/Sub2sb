[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Sub2sb"
version = "1.1.0"
description = "Convert proxy subscriptions into sing-box JSON configurations"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0.2,<7",
]

[tool.setuptools]
py-modules = [
    "converter",
    "sub2singbox",
    "remote_subscription",
    "subscription_utils",
    "subscription_lab",
    "template_options",
]

[dependency-groups]
dev = [
    "workers-py>=1.17.6 ; python_full_version >= '3.11'",
    "workers-runtime-sdk>=1.9.2 ; python_full_version >= '3.11'",
]
