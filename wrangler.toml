# Cloudflare Workers（Python）部署配置
# https://developers.cloudflare.com/workers/languages/python/
#
# 本地：uv sync --group dev && uv run pywrangler dev
# 部署：uv run pywrangler deploy
# 密钥：uv run --python 3.11 pywrangler secret put YAML2SB_API_KEY

name = "yaml2sb"
main = "worker.py"
compatibility_date = "2026-09-30"
compatibility_flags = ["python_workers"]

[assets]
directory = "./templates/"
binding = "ASSETS"
run_worker_first = true

[[kv_namespaces]]
binding = "SUBSCRIPTIONS"
id = "your-kv-namespace-id" # 替换为自己创建的 KV namespace ID

