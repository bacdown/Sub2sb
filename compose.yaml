services:
  Sub2sb:
    build: .
    container_name: Sub2sb
    ports:
      - "${SUB2SB_PORT:-8080}:8080"
    environment:
      SUB2SB_API_KEY: "${SUB2SB_API_KEY:-}"
      SUB2SB_DB_PATH: /data/subscriptions.sqlite3
    volumes:
      - Sub2sb-data:/data
    restart: unless-stopped

volumes:
  Sub2sb-data:
