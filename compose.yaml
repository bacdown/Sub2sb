services:
  yaml2sb:
    build: .
    container_name: yaml2sb
    ports:
      - "${YAML2SB_PORT:-8080}:8080"
    environment:
      YAML2SB_API_KEY: "${YAML2SB_API_KEY:-}"
      YAML2SB_DB_PATH: /data/subscriptions.sqlite3
    volumes:
      - yaml2sb-data:/data
    restart: unless-stopped

volumes:
  yaml2sb-data:
